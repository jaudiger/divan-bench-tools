name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - 'tests/fixtures/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  lint-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-python.yml@0fdb4286768192eacc11e2a71d0ef74fcd1c3195

  test-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/tests-python.yml@0fdb4286768192eacc11e2a71d0ef74fcd1c3195

  lint-actions:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-github-actions.yml@0fdb4286768192eacc11e2a71d0ef74fcd1c3195

  ci:
    if: always()
    needs: [lint-python, test-python, lint-actions]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more required checks failed"
            exit 1
          fi
